name: Windows build setup
description: >
  Python, the .NET SDK (WinUI viewer), the MSVC environment and vcpkg at the
  manifest's baseline with its binary cache: the steps every Windows job takes
  between checkout (with submodules) and configure.

inputs:
  dotnet:
    description: Install the .NET SDK for the WinUI viewer build
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Setup .NET SDK
      if: ${{ inputs.dotnet == 'true' }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: "8.0.x"

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Cache vcpkg checkout
      id: vcpkg-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}\vcpkg
        key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json') }}

    - name: Bootstrap vcpkg
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # The vcpkg tool from the manifest's baseline commit, not whatever
        # vcpkg master is on the day of the run.
        $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
        if (-not $baseline) { throw "Could not resolve vcpkg baseline from vcpkg-configuration.json" }
        $vcpkgDir = "$env:RUNNER_TEMP\vcpkg"
        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          if (Test-Path $vcpkgDir) { Remove-Item -Recurse -Force $vcpkgDir }
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg $vcpkgDir
          if ($LASTEXITCODE -eq 0) {
            git -C $vcpkgDir checkout --quiet --detach $baseline
            if ($LASTEXITCODE -eq 0) {
              & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
          }
          Write-Warning "vcpkg bootstrap attempt $attempt/$maxAttempts failed"
          if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds ($attempt * 10) }
        }
        throw "vcpkg bootstrap of baseline $baseline failed after $maxAttempts attempts"

    - name: Setup vcpkg binary cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/AppData/Local/vcpkg/archives
        key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*.cmake') }}
        restore-keys: |
          vcpkg-archives-
