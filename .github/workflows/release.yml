name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-tests.yml
    # ci.yml ignores version tags, so the release caller must enable the full
    # Linux gate set itself instead of relying on an earlier branch run.
    with:
      run_asan: true
      run_fuzz: true
      run_clang_tidy: true

  release:
    name: Build + Release
    needs: linux
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Visual Studio + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: cmake --build build-win --config RelWithDebInfo

      - name: Build WinUI shell
        shell: cmd
        run: scripts\build-winui.cmd

      # Windows-only test targets are invisible to the Linux job, so a release
      # must not be cut without running them.
      - name: Run tests (Windows)
        shell: pwsh
        run: ctest --test-dir build-win -C RelWithDebInfo --output-on-failure

      - name: Resolve release zip path
        id: release_zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = (python -c "import sys; sys.path.insert(0, 'scripts'); from release_contract import release_zip_name; print(release_zip_name(sys.argv[1]))" $tag).Trim()
          $zipPath = "dist/$zipName"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package zip
        shell: pwsh
        run: |
          python scripts/package.py --build-dir build-win --out "${{ steps.release_zip.outputs.zip_path }}" --no-pdb

      - name: Run release hard gate
        shell: bash
        run: bash scripts/verify_release_gate.sh "$PWD" "$PWD" "$PWD/${{ steps.release_zip.outputs.zip_path }}"

      - name: Resolve release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $draftPath = Join-Path "docs/release/drafts" "$tag.md"
          if (Test-Path $draftPath) {
            Copy-Item $draftPath release_notes.md
            exit 0
          }

          $lines = Get-Content CHANGELOG.md
          $capture = $false
          $notes = @()
          foreach ($line in $lines) {
            if ($line -match "^## $([regex]::Escape($tag))\b") {
              $capture = $true
              $notes += $line
              continue
            }
            if ($capture -and $line -match "^## v") {
              break
            }
            if ($capture) {
              $notes += $line
            }
          }
          if ($notes.Count -eq 0) {
            "Release $tag" | Out-File -FilePath release_notes.md -Encoding utf8
          } else {
            ($notes -join "`n").TrimEnd() | Out-File -FilePath release_notes.md -Encoding utf8
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $args = @("release", "create", $tag, "--title", $tag, "--notes-file", "release_notes.md")
          if ($tag -match "-rc") {
            $args += "--prerelease"
          }
          $args += "${{ steps.release_zip.outputs.zip_path }}"
          gh @args
