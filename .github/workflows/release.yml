name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the job that creates the GitHub Release can write.
permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-tests.yml
    # ci.yml ignores version tags, so the release caller must enable the full
    # Linux gate set itself instead of relying on an earlier branch run.
    with:
      run_asan: true
      run_fuzz: true
      run_clang_tidy: true

  release:
    name: Build + Release
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write  # gh release create / upload

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true  # extern/CommonLibSSE-NG (VR is off, so not recursive)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          # The vcpkg tool from the manifest's baseline commit, not whatever
          # vcpkg master is on the day of the run.
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout of baseline $baseline failed" }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Ninja + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake"

      # Linking a freshly built test has failed on the runner with "Access is
      # denied" or "used by another process"; a second pass only relinks what
      # is missing.
      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: |
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed once; retrying the remaining steps."
            cmake --build build-win
          }
          exit $LASTEXITCODE

      - name: Run clang-tidy over complete Windows production sources
        timeout-minutes: 20
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\LLVM\bin\clang-tidy.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-tidy.exe"
          )
          $tidy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tidy) {
            $tidy = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022" -Recurse -Filter clang-tidy.exe |
              Where-Object { $_.FullName -match '\\x64\\bin\\clang-tidy\.exe$' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tidy) { throw "clang-tidy.exe not found" }
          python scripts/run_clang_tidy.py --build-dir build-win --clang-tidy "$tidy" --jobs 4 --expect-major 20

      - name: Build WinUI shell
        shell: cmd
        run: scripts\build-winui.cmd

      # Host details for the intermittent self-dump failure (see dump-stress.yml).
      - name: Runner info
        shell: pwsh
        run: ./scripts/print_runner_info.ps1

      # Windows-only test targets are invisible to the Linux job, so a release
      # must not be cut without running them.
      - name: Run tests (Windows)
        shell: pwsh
        run: ctest --test-dir build-win -C RelWithDebInfo --output-on-failure --timeout 600

      - name: Resolve release zip path
        id: release_zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = (python -c "import sys; sys.path.insert(0, 'scripts'); from release_contract import release_zip_name; print(release_zip_name(sys.argv[1]))" $tag).Trim()
          $isPrerelease = (python -c "import sys; sys.path.insert(0, 'scripts'); from release_contract import release_tag_is_prerelease; print(str(release_tag_is_prerelease(sys.argv[1])).lower())" $tag).Trim()
          $zipPath = "dist/$zipName"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package zip
        shell: pwsh
        run: |
          python scripts/package.py --build-dir build-win --config RelWithDebInfo --out "${{ steps.release_zip.outputs.zip_path }}" --no-pdb

      # The zip ships without PDBs; keep the ones matching the released
      # binaries so a SkyrimDiag.dll+0x... crash in a user's report can be
      # symbolized later. The workflow artifact expires after 90 days; the
      # same files also go on the release itself (symbols zip below).
      - name: Upload release symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tullius_ctd_loger_${{ github.ref_name }}_symbols
          path: |
            build-win/bin/SkyrimDiag.pdb
            build-win/bin/SkyrimDiagHelper.pdb
            build-win/bin/SkyrimDiagDumpToolNative.pdb
            build-win/bin/SkyrimDiagDumpToolCli.pdb
            build-win/bin/SkyrimDiagDumpToolWinUI.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Run release hard gate
        env:
          SKYDIAG_REQUIRE_CLEAN_PROVENANCE: "1"
          SKYDIAG_RELEASE_CONFIG: "RelWithDebInfo"
        shell: bash
        run: bash scripts/verify_release_gate.sh "$PWD" "$PWD" "$PWD/${{ steps.release_zip.outputs.zip_path }}"

      - name: Resolve release notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "skydiag-release-notes.md"
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          python scripts/resolve_release_notes.py `
            --repo-root . `
            --tag $tag `
            --output $notesPath `
            --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release symbols
        id: release_symbols
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $symbolsPath = "dist/Tullius_ctd_loger_${tag}_symbols.zip"
          Compress-Archive -Force -DestinationPath $symbolsPath -Path @(
            "build-win/bin/SkyrimDiag.pdb",
            "build-win/bin/SkyrimDiagHelper.pdb",
            "build-win/bin/SkyrimDiagDumpToolNative.pdb",
            "build-win/bin/SkyrimDiagDumpToolCli.pdb",
            "build-win/bin/SkyrimDiagDumpToolWinUI.pdb")
          "symbols_path=$symbolsPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Created as a draft: nothing is public until the readback below has
      # verified the uploaded zip. A draft left by a failed earlier run of
      # this tag is replaced, so the job can be re-run; a published release
      # is never touched.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expectedPrerelease = "${{ steps.release_zip.outputs.is_prerelease }}" -eq "true"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not [bool]($existing | ConvertFrom-Json).isDraft) {
              throw "A published release already exists for $tag"
            }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the earlier draft release of $tag" }
          }
          $args = @("release", "create", $tag, "--draft", "--title", $tag, "--notes-file", "${{ steps.release_notes.outputs.notes_path }}")
          if ($expectedPrerelease) {
            $args += "--prerelease"
          }
          $args += "${{ steps.release_zip.outputs.zip_path }}"
          $args += "${{ steps.release_symbols.outputs.symbols_path }}"
          gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }

      - name: Verify public release readback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expectedPrerelease = "${{ steps.release_zip.outputs.is_prerelease }}" -eq "true"
          $zipName = "${{ steps.release_zip.outputs.zip_name }}"
          $downloadDir = Join-Path $env:RUNNER_TEMP "skydiag-public-release"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download $tag --pattern $zipName --dir $downloadDir --clobber

          $localZip = Resolve-Path "${{ steps.release_zip.outputs.zip_path }}"
          $publicZip = Join-Path $downloadDir $zipName
          if (-not (Test-Path $publicZip)) {
            throw "Public release asset was not readable after upload: $publicZip"
          }
          $localHash = (Get-FileHash $localZip -Algorithm SHA256).Hash
          $publicHash = (Get-FileHash $publicZip -Algorithm SHA256).Hash
          if ($localHash -ne $publicHash) {
            throw "Public release asset hash mismatch: local=$localHash public=$publicHash"
          }

          python scripts/verify_release_zip.py `
            --repo-root . `
            --zip $publicZip `
            --build-dir build-win `
            --winui-dir build-winui `
            --config RelWithDebInfo `
            --require-clean
          if ($LASTEXITCODE -ne 0) { throw "verify_release_zip.py rejected the public release asset (exit $LASTEXITCODE)" }

          $release = gh release view $tag --json isPrerelease | ConvertFrom-Json
          $actualPrerelease = [bool]$release.isPrerelease
          if ($actualPrerelease -ne $expectedPrerelease) {
            throw "GitHub prerelease state mismatch: tag=$tag expected=$expectedPrerelease actual=$actualPrerelease"
          }
          Write-Host "Public release readback SHA256=$publicHash"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expectedPrerelease = "${{ steps.release_zip.outputs.is_prerelease }}" -eq "true"
          if ($expectedPrerelease) {
            gh release edit $tag --draft=false
          } else {
            gh release edit $tag --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE)" }
          $published = gh release view $tag --json isDraft,isPrerelease | ConvertFrom-Json
          if ([bool]$published.isDraft -or ([bool]$published.isPrerelease -ne $expectedPrerelease)) {
            throw "Release $tag was not published as expected: isDraft=$($published.isDraft) isPrerelease=$($published.isPrerelease)"
          }
