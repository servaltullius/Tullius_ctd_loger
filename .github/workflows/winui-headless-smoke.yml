name: WinUI Headless Smoke

on:
  workflow_dispatch:

jobs:
  winui-headless-smoke:
    name: WinUI Headless Smoke
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Ninja + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: cmake --build build-win

      - name: Build WinUI shell
        shell: cmd
        run: scripts\build-winui.cmd

      - name: Package exact release zip
        id: release_zip
        shell: pwsh
        run: |
          $zipName = (python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_contract import project_version, release_zip_name; print(release_zip_name('v' + project_version(Path('.'))))").Trim()
          $zipPath = "dist/$zipName"
          python scripts/package.py --build-dir build-win --config RelWithDebInfo --out $zipPath --no-pdb
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extracted package launcher smoke with valid minidump
        timeout-minutes: 2
        shell: pwsh
        run: |
          python scripts/smoke_release_zip.py `
            --repo-root . `
            --zip "${{ steps.release_zip.outputs.zip_path }}" `
            --build-dir build-win `
            --config RelWithDebInfo
