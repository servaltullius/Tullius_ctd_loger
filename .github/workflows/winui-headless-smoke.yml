name: WinUI Headless Smoke

on:
  workflow_dispatch:

jobs:
  winui-headless-smoke:
    name: WinUI Headless Smoke
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true  # extern/CommonLibSSE-NG (VR is off, so not recursive)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          # The vcpkg tool from the manifest's baseline commit, not whatever
          # vcpkg master is on the day of the run.
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout of baseline $baseline failed" }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Ninja + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: cmake --build build-win

      - name: Build WinUI shell
        shell: cmd
        run: scripts\build-winui.cmd

      - name: Package exact release zip
        id: release_zip
        shell: pwsh
        run: |
          $zipName = (python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_contract import project_version, release_zip_name; print(release_zip_name('v' + project_version(Path('.'))))").Trim()
          $zipPath = "dist/$zipName"
          python scripts/package.py --build-dir build-win --config RelWithDebInfo --out $zipPath --no-pdb
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extracted package launcher smoke with valid minidump
        timeout-minutes: 2
        shell: pwsh
        run: |
          python scripts/smoke_release_zip.py `
            --repo-root . `
            --zip "${{ steps.release_zip.outputs.zip_path }}" `
            --build-dir build-win `
            --config RelWithDebInfo
