name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-tests.yml
    with:
      run_asan: true
      run_fuzz: true
      run_clang_tidy: true

  windows-validate:
    name: Windows Validate (Build + Package + Gate)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Visual Studio + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: cmake --build build-win --config RelWithDebInfo

      - name: Build WinUI shell
        shell: cmd
        run: scripts\build-winui.cmd

      # The Linux job cannot cover targets guarded by if(WIN32), so without this
      # step those tests never ran anywhere.
      - name: Run tests (Windows)
        shell: pwsh
        run: ctest --test-dir build-win -C RelWithDebInfo --output-on-failure

      - name: Resolve release zip path
        id: release_zip
        shell: pwsh
        run: |
          $zipName = (python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_contract import project_version, release_zip_name; print(release_zip_name('v' + project_version(Path('.'))))").Trim()
          $zipPath = "dist/$zipName"
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package release zip (no PDB)
        shell: pwsh
        run: |
          python scripts/package.py --build-dir build-win --out "${{ steps.release_zip.outputs.zip_path }}" --no-pdb

      - name: Run release hard gate
        shell: bash
        run: bash scripts/verify_release_gate.sh "$PWD" "$PWD" "$PWD/${{ steps.release_zip.outputs.zip_path }}"

      - name: Upload zip artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tullius-ctd-logger-windows-zip
          path: |
            dist/Tullius_ctd_loger_v*.zip
          if-no-files-found: error
