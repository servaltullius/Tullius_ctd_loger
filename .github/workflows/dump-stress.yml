name: Dump Stress

# Runs selected Windows tests many times in a row on a CI runner.
#
# The helper's dump tests intermittently fail on CI with ERROR_PARTIAL_COPY
# (MiniDumpWriteDump failed: 2147944184) but never locally, so waiting for a
# random failure on a merge is the only other way to see one. This repeats
# them until the first failure; the failing test prints the helper log, whose
# "Crash dump attempt ... failed" lines carry the dump writer's diagnostics.
# Manual only: it never runs on pushes or pull requests.
#
# Runner-only failures seen so far (this ERROR_PARTIAL_COPY and "Access is
# denied" when linking a freshly built test) point at real-time antivirus
# scanning on the runner. defender_exclusion=true excludes the workspace and
# the test executables from Microsoft Defender; running once with it off and
# once with it on shows whether Defender is behind the dump failure.

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs per test (stops at the first failure)"
        required: true
        default: "100"
      tests:
        description: "ctest -R regex of the tests to repeat"
        required: true
        default: "skydiag_helper_runtime_smoke_tests|skydiag_crash_dump_context_tests"
      defender_exclusion:
        description: "Exclude the workspace and test executables from Microsoft Defender (experiment)"
        type: boolean
        required: true
        default: false

jobs:
  dump-stress:
    name: Dump Stress (repeat until fail)
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Exclude workspace from Microsoft Defender (experiment)
        if: ${{ inputs.defender_exclusion }}
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "$env:GITHUB_WORKSPACE\build-win\bin\*"

      - name: Record Microsoft Defender state
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled, BehaviorMonitorEnabled, OnAccessProtectionEnabled | Format-List
          $pref = Get-MpPreference
          "ExclusionPath: " + ($pref.ExclusionPath -join "; ")
          "ExclusionProcess: " + ($pref.ExclusionProcess -join "; ")

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"

      - name: Setup vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-

      - name: Configure (Ninja + vcpkg)
        shell: pwsh
        run: >
          cmake -S . -B build-win
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake"

      # Linking a freshly built test has failed on the runner with "Access is
      # denied"; a second pass only relinks what is missing.
      - name: Build (RelWithDebInfo)
        shell: pwsh
        run: |
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed once; retrying the remaining steps."
            cmake --build build-win
          }
          exit $LASTEXITCODE

      - name: Repeat selected tests until the first failure
        shell: pwsh
        env:
          STRESS_REPEAT: ${{ inputs.repeat }}
          STRESS_TESTS: ${{ inputs.tests }}
        run: >
          ctest --test-dir build-win -C RelWithDebInfo
          -R "$env:STRESS_TESTS"
          --repeat "until-fail:$env:STRESS_REPEAT"
          --output-on-failure
